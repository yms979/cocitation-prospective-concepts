  <text x="8" y="183.5" font-size="5" fill="#666666">Positions: Kamada–Kawai layout of the induced subgraph, shared by (b) and (c). Node size scales with degree in the full citation network; the prospective node is drawn enlarged.</text>
  <text x="8" y="191" font-size="5" fill="#666666">The decoded text is nearest to US-10058393-B2 (2018) within the corpus, cosine 0.951, and to US-2025288363-A1 (2025) among patents published after the collection window, cosine 0.929.</text>
